[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movie-standardizer"
version = "0.1.0"
description = "Standardize and convert movies from Torrents into Movies_AV1"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ddgs>=9.0.0",
]

[project.scripts]
movie-std = "movie_standardizer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["movie_standardizer"]
